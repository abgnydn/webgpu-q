<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="Iowan Old Style, Charter, Georgia, serif">
  <rect width="820" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="42" font-size="22" font-weight="700" fill="#1a1a1a">Browser-tab swarm HF: wall-time vs system size</text>
  <text x="60" y="66" font-size="14" fill="#666">Hartree–Fock SCF, 16 GB M2 Pro, Chromium (cross-origin isolated). All energies converged + PySCF-validated.</text>

  <!-- Plot frame -->
  <line x1="90" y1="80" x2="90" y2="450" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="450" x2="760" y2="450" stroke="#333" stroke-width="1.5"/>

  <!-- Y axis: log10 wall-time. ticks at 1,10,100,1000 s -->
  <!-- y(t)=450-(log10(t))/3.0*370 ; range 1s..1000s -->
  <!-- 1s -> 450 ; 10s -> 327 ; 100s -> 203 ; 1000s -> 80 -->
  <g font-size="12" fill="#444">
    <line x1="86" y1="450" x2="90" y2="450" stroke="#333"/><text x="80" y="454" text-anchor="end">1 s</text>
    <line x1="86" y1="327" x2="760" y2="327" stroke="#eee"/><line x1="86" y1="327" x2="90" y2="327" stroke="#333"/><text x="80" y="331" text-anchor="end">10 s</text>
    <line x1="86" y1="203" x2="760" y2="203" stroke="#eee"/><line x1="86" y1="203" x2="90" y2="203" stroke="#333"/><text x="80" y="207" text-anchor="end">100 s</text>
    <line x1="86" y1="80"  x2="760" y2="80"  stroke="#eee"/><line x1="86" y1="80"  x2="90" y2="80"  stroke="#333"/><text x="80" y="84"  text-anchor="end">1000 s</text>
  </g>
  <text x="30" y="265" font-size="14" fill="#444" transform="rotate(-90 30 265)" text-anchor="middle">HF SCF wall-time (log scale)</text>

  <!-- X axis: basis functions n. x(n)=90+(n-60)/(320-60)*670 -->
  <g font-size="12" fill="#444">
    <line x1="90"  y1="450" x2="90"  y2="454" stroke="#333"/><text x="90"  y="470" text-anchor="middle">60</text>
    <line x1="244" y1="450" x2="244" y2="454" stroke="#333"/><text x="244" y="470" text-anchor="middle">120</text>
    <line x1="399" y1="450" x2="399" y2="454" stroke="#333"/><text x="399" y="470" text-anchor="middle">180</text>
    <line x1="553" y1="450" x2="553" y2="454" stroke="#333"/><text x="553" y="470" text-anchor="middle">240</text>
    <line x1="708" y1="450" x2="708" y2="454" stroke="#333"/><text x="708" y="470" text-anchor="middle">300</text>
  </g>
  <text x="425" y="498" font-size="14" fill="#444" text-anchor="middle">basis functions  n</text>

  <!-- Data points.  x(n)=90+(n-60)/260*670 ; y(t)=450-log10(t)/3.0*370 -->
  <!-- anthracene STO-3G n=80 t=8  -> x=141 y=450-0.903/3*370=339 -->
  <!-- benzene  cc-pVDZ  n=120 t=5.5-> x=244 y=450-0.740/3*370=359 -->
  <!-- pentacene STO-3G  n=124 t=38 -> x=255 y=450-1.580/3*370=255 -->
  <!-- naphthalene cc-pVDZ n=190 t=14-> x=425 y=450-1.146/3*370=309 -->
  <!-- C60      STO-3G  n=300 t=730 -> x=708 y=450-2.863/3*370=97 -->

  <!-- STO-3G points (orange) -->
  <g fill="#d2691e">
    <circle cx="141" cy="339" r="6"/>
    <circle cx="255" cy="255" r="6"/>
    <circle cx="708" cy="97"  r="9" stroke="#8b2500" stroke-width="2"/>
  </g>
  <!-- cc-pVDZ points (teal) -->
  <g fill="#1f7a7a">
    <circle cx="244" cy="359" r="6"/>
    <circle cx="425" cy="309" r="6"/>
  </g>

  <!-- Labels -->
  <g font-size="12.5" fill="#222">
    <text x="141" y="332" text-anchor="middle">anthracene · 8 s</text>
    <text x="244" y="377" text-anchor="middle">benzene · 5.5 s</text>
    <text x="255" y="248" text-anchor="middle">pentacene · 38 s</text>
    <text x="425" y="302" text-anchor="middle">naphthalene · 14 s</text>
    <text x="708" y="86"  text-anchor="middle" font-weight="700" fill="#8b2500">C₆₀ · 730 s</text>
    <text x="708" y="120" text-anchor="middle" font-size="11" fill="#8b2500">300 basis · 1.82 GB B-tensor</text>
    <text x="708" y="134" text-anchor="middle" font-size="11" fill="#8b2500">across 4 tabs (454 MB ea)</text>
  </g>

  <!-- naphthalene single-tab comparison marker. y(28s)=450-log10(28)/3*370=272 -->
  <g>
    <circle cx="425" cy="272" r="5" fill="none" stroke="#999" stroke-width="1.5"/>
    <text x="437" y="269" font-size="11" fill="#777">naphthalene single-tab: 28 s (swarm 2× faster)</text>
    <line x1="425" y1="277" x2="425" y2="304" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <circle cx="540" cy="420" r="6" fill="#1f7a7a"/><text x="552" y="424">cc-pVDZ</text>
    <circle cx="640" cy="420" r="6" fill="#d2691e"/><text x="652" y="424">STO-3G</text>
  </g>
</svg>
