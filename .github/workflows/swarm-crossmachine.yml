name: Swarm cross-machine HF

# Cross-machine distributed Hartree–Fock over a free public relay, on N separate
# Actions VMs. Each VM (matrix entry) is a real machine on the public internet;
# they rendezvous via deterministic ids from the run id, coordinate through a
# free MQTT broker, and run a distributed DF-HF SCF where each holds only its own
# tensor slice. Run at N=2 and N=4 to show the per-machine footprint scaling as
# full_B / N (the aggregate-resource property). Free for a public repo.
#
# The pure-WebRTC and relay-roundtrip de-risk specs (swarm-webrtc-crossmachine,
# swarm-relay-crossmachine) remain in the repo for manual runs; the HF jobs below
# subsume their connectivity check.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/parallel/swarm/relay-transport.ts"
      - "e2e/swarm-hf-relay-crossmachine.spec.ts"
      - ".github/workflows/swarm-crossmachine.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hf-n2:
    name: HF N=2 (node ${{ matrix.idx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        idx: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Distributed HF (N=2, node ${{ matrix.idx }})
        env:
          IDX: ${{ matrix.idx }}
          NTOTAL: "2"
          ROOM: wgqhf2-${{ github.run_id }}
        run: npx playwright test e2e/swarm-hf-relay-crossmachine.spec.ts --reporter=list

  hf-n4:
    name: HF N=4 (node ${{ matrix.idx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        idx: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Distributed HF (N=4, node ${{ matrix.idx }})
        env:
          IDX: ${{ matrix.idx }}
          NTOTAL: "4"
          ROOM: wgqhf4-${{ github.run_id }}
        run: npx playwright test e2e/swarm-hf-relay-crossmachine.spec.ts --reporter=list
