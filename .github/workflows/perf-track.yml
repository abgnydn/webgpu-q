# Tracking-only weekly perf run against the slow-suite cells in bench/baseline.json.
# Never gates merges; see BENCH.md rule (a).
name: perf-track
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  perf-track:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # --silent: npm's `> pkg@ver script` banners would corrupt the JSON capture
      # (observed 2026-09-05: check-perf hard-failed on the banner, correctly).
      - run: npm --silent run test:slow -- --reporter=json > /tmp/vitest-perf.json
      - run: node bench/check-perf.mjs /tmp/vitest-perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: /tmp/vitest-perf.json
