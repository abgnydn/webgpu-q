name: GPU smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: SwiftShader smoke
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run landing smoke
        run: npx playwright test e2e/landing-smoke.spec.ts --reporter=line

  # Deterministic shader validation — complements the runtime SwiftShader smoke
  # by catching WGSL syntax / semantic errors before any browser is launched.
  shader-compile:
    name: WGSL shader compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install naga-cli
        run: cargo install naga-cli --locked

      - name: Validate WGSL shaders
        run: |
          # Bare `naga <file>` with no output arg = parse + validate only.
          for f in src/shaders/*.wgsl; do
            echo "Validating $f"
            ~/.cargo/bin/naga "$f"
          done
