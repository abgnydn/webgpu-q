name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Nightly slow suite — the measured heavy cells that dominate wall time.
  schedule:
    - cron: "0 7 * * 0"  # 07:00 UTC every Sunday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  test-vitest:
    name: test-vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # E2E suite is intentionally skipped here — it requires a WebGPU-capable
      # Chromium with GPU virtualization, which the default Ubuntu runners
      # don't expose. Run locally with `npm run test:e2e` (~1.5 min on M2 Pro).

      - name: Unit tests (fast subset)
        run: npm run test:fast

  test-slow:
    # Nightly-only slow suite. These files were measured to dominate the full
    # `npm run test` wall time; running them here keeps the PR path fast while
    # still gating the heavy chemistry/MPS cells at least weekly.
    #
    # Measured slow list (Vitest basic reporter, M2 Pro, single run):
    #   tests/chemistry/dft-gradient.test.ts            ~92 s
    #   tests/chemistry/df-streaming-accuracy.test.ts   ~91 s
    #   tests/chemistry/ccpvdz-spherical.test.ts        ~80 s
    #   tests/chemistry/aug-ccpvdz-firstrow.test.ts     ~57 s
    #   tests/manybody/dmrg-pfeuty-bethe.test.ts        ~52 s
    #   tests/chemistry/aug-ccpvdz.test.ts              ~39 s
    #   tests/chemistry/vibrations.test.ts              ~39 s
    #   tests/chemistry/frozen-core-audit.test.ts       ~31 s
    name: test-slow
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (slow subset)
        run: npm run test:slow

  knip:
    name: knip (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find unused dependencies / exports
        run: npx --yes knip --no-progress

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-vitest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
