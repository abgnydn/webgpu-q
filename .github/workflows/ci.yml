name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # E2E suite is intentionally skipped here — it requires a WebGPU-capable
      # Chromium with GPU virtualization, which the default Ubuntu runners
      # don't expose. Run locally with `npm run test:e2e` (~1.5 min on M2 Pro).

  gradient-ccpvdz:
    name: cc-pVDZ gradient vs FD
    runs-on: ubuntu-latest
    # Split out of the main test job on 2026-09-02. These three cells
    # (Cl/HCl cart+sph, S/H2S cart) each run a full central-FD sweep at
    # cc-pVDZ: 2x3N SCF solves. Measured 109 / 110 / 204 s on an M2 Max and
    # 284 / 286 / 517 s here running alone. On the main job all three blew
    # the 340 s per-test cap and failed CI on numbers that were correct
    # (run 31357193244) -- only S/H2S is intrinsically over it; the other
    # two stretched past only because vitest runs 4 files in parallel on a
    # 2-core runner. Isolation, not a larger timeout, is what fixes that.
    #
    # The alternative was a bigger timeout on a job already running 39
    # minutes. This keeps the assertions and the 1.5e-6 bar byte-identical
    # while moving the long pole onto a parallel job, so total PR wall
    # clock goes DOWN. tests/chemistry/elements/gradient-agreement.test.ts
    # gates them on SLOW_TESTS, which nothing else sets.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: cc-pVDZ analytic gradient vs central FD
        env:
          SLOW_TESTS: "1"
        run: npx vitest run tests/chemistry/elements/gradient-agreement.test.ts

  basis-digits:
    name: basis digits vs PySCF
    runs-on: ubuntu-latest
    # The only gate that checks the basis-set DIGITS at the source
    # (src/chemistry/integrals.ts) instead of checking an energy that happens to
    # land close. Every (element × basis) cell the repo ships is compared against
    # pyscf.gto.basis.load; intentional deviations (Li STO-3G is s-only) are an
    # explicit, exponent-matched allowlist in the script, so a bad digit in the
    # same cell still fails.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install PySCF
        run: python3 -m pip install --upgrade pip pyscf

      - name: Basis constants vs pyscf.gto.basis.load
        run: npm run check:basis

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
