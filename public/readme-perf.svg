<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Performance: 841s baseline to 16.8s benzene cc-pVDZ HF in v0.8.0 — 50× speedup from WASM hot-path stack. Plus the CCSD(T) GPU win (~14× median, 28.4× best of 20, noisy) is still shipping.">
  <defs>
    <linearGradient id="bgPerf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cpuBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="wasmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gpuBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="speedTxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="dropPerf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.30"/>
    </filter>
    <pattern id="dotsPerf" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="url(#bgPerf)"/>
  <rect width="1200" height="620" fill="url(#dotsPerf)"/>

  <text x="40" y="38" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="0.25em" fill="#64748b">v0.8.0 HEADLINE — WASM HOT-PATH STACK</text>
  <text x="40" y="78" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#e2e8f0">benzene · cc-pVDZ · HF SCF</text>
  <text x="40" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#64748b" font-style="italic">Apple M2 Pro · Chromium WebGPU · single-run · E = −230.72273482 Ha · matches direct path to f32 noise</text>

  <text x="40" y="160" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.15em" fill="#94a3b8" font-weight="600">v0.7.0 baseline · TS-only direct ERI + HF</text>
  <rect x="40" y="172" width="900" height="46" rx="3" fill="url(#cpuBar)"/>
  <text x="60" y="203" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e2e8f0">841 s   ⟵ 14 min</text>

  <text x="40" y="260" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.15em" fill="#a855f7" font-weight="600">v0.8.0 · WASM ×8 workers + branch-free + pair cache + SIMD JK</text>
  <rect x="40" y="272" width="18" height="46" rx="3" fill="url(#wasmBar)" filter="url(#dropPerf)"/>
  <text x="68" y="303" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#a855f7">16.8 s</text>

  <g transform="translate(900 248)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="92" font-weight="800" fill="url(#speedTxt)" text-anchor="start" letter-spacing="-0.04em">50×</text>
    <text x="0" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.25em">END-TO-END HF SCF</text>
  </g>

  <line x1="40" y1="358" x2="1160" y2="358" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="392" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.25em" fill="#64748b" font-weight="600">COMPOUND BREAKDOWN · BENZENE cc-pVDZ HF</text>
  <text x="40" y="416" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic">Each lever shipped in v0.8.0 — measured ERI + HF wall time on the same M2 Pro</text>

  <g font-family="ui-monospace, monospace">
    <text x="40" y="452" font-size="11" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">▸ STAGE</text>
    <text x="490" y="452" font-size="11" letter-spacing="0.2em" fill="#22d3ee" font-weight="700" text-anchor="end">WALL TIME</text>
    <text x="560" y="452" font-size="11" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">SPEEDUP</text>

    <g transform="translate(40 480)" font-size="13">
      <g>
        <text x="0" y="0" fill="#e2e8f0">TS-only baseline</text>
        <text x="450" y="0" fill="#e2e8f0" text-anchor="end">841 s</text>
        <text x="560" y="0" fill="#64748b">1×</text>
      </g>
      <g transform="translate(0 22)">
        <text x="0" y="0" fill="#e2e8f0">+ Rust→WASM ERI kernel</text>
        <text x="450" y="0" fill="#e2e8f0" text-anchor="end">189 s</text>
        <text x="560" y="0" fill="#22d3ee" font-weight="700">4.4×</text>
      </g>
      <g transform="translate(0 44)">
        <text x="0" y="0" fill="#e2e8f0">+ Web Workers (×8 parallel)</text>
        <text x="450" y="0" fill="#e2e8f0" text-anchor="end">38.5 s</text>
        <text x="560" y="0" fill="#22d3ee" font-weight="700">21.5×</text>
      </g>
      <g transform="translate(0 66)">
        <text x="0" y="0" fill="#e2e8f0">+ branch-free `prim_eri`</text>
        <text x="450" y="0" fill="#e2e8f0" text-anchor="end">25.3 s</text>
        <text x="560" y="0" fill="#22d3ee" font-weight="700">32.7×</text>
      </g>
      <g transform="translate(0 88)">
        <text x="0" y="0" fill="#e2e8f0">+ pair-table cache</text>
        <text x="450" y="0" fill="#e2e8f0" text-anchor="end">16.8 s</text>
        <text x="560" y="0" fill="#22d3ee" font-weight="700">49×</text>
      </g>
      <g transform="translate(0 110)">
        <text x="0" y="0" fill="#e2e8f0">+ r_aux pool + SIMD JK</text>
        <text x="450" y="0" fill="#a855f7" font-weight="700" text-anchor="end">16.8 s</text>
        <text x="560" y="0" fill="#a855f7" font-weight="700">50×</text>
      </g>
    </g>

    <text x="660" y="452" font-size="11" letter-spacing="0.2em" fill="#fbbf24" font-weight="700">▸ STILL SHIPPING (v0.7.0)</text>
    <g transform="translate(660 480)" font-size="13">
      <g>
        <text x="0" y="0" fill="#e2e8f0">CCSD(T) GPU · H₂O cc-pVDZ · median</text>
        <text x="500" y="0" fill="#fbbf24" font-weight="700" text-anchor="end">~14×</text>
      </g>
      <g transform="translate(0 22)">
        <text x="0" y="0" fill="#e2e8f0">EE/IP-EOM-CCSD PySCF-ported</text>
        <text x="500" y="0" fill="#fbbf24" font-weight="700" text-anchor="end">&lt; 10⁻¹⁰ Ha</text>
      </g>
      <g transform="translate(0 44)">
        <text x="0" y="0" fill="#e2e8f0">aux-basis f64 DF (n ≥ 200)</text>
        <text x="500" y="0" fill="#fbbf24" font-weight="700" text-anchor="end">49 μHa</text>
      </g>
      <g transform="translate(0 66)">
        <text x="0" y="0" fill="#e2e8f0">DFT ladder · UKS · TDDFT α(ω)</text>
        <text x="500" y="0" fill="#fbbf24" font-weight="700" text-anchor="end">full ladder</text>
      </g>
      <g transform="translate(0 88)">
        <text x="0" y="0" fill="#e2e8f0">Browser-platform stack · v0.7</text>
        <text x="500" y="0" fill="#fbbf24" font-weight="700" text-anchor="end">Pyodide + PWA</text>
      </g>
      <g transform="translate(0 110)">
        <text x="0" y="0" fill="#e2e8f0">reference-grounded CI</text>
        <text x="500" y="0" fill="#22c55e" font-weight="700" text-anchor="end">GREEN</text>
      </g>
    </g>
  </g>

  <text x="40" y="608" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">Test wall time on benzene cc-pVDZ HF dropped from 11 min to 29 s in v0.8.0 (skipERI + skipOAO option). aux-basis f64 DF unlocks n ≥ 200 where direct n⁴ ERI doesn't fit in browser tab memory. Full breakdown: LIMITATIONS.md.</text>
</svg>
