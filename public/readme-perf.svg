<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Performance: 198.6s CPU to 5.05s GPU on H2O cc-pVDZ CCSD(T) plus an honest two-sided comparison vs PySCF showing where we win and where we lose">
  <defs>
    <linearGradient id="bgPerf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cpuBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gpuBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="speedTxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="dropPerf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#22d3ee" flood-opacity="0.25"/>
    </filter>
    <pattern id="dotsPerf" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="url(#bgPerf)"/>
  <rect width="1200" height="620" fill="url(#dotsPerf)"/>

  <text x="40" y="38" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="0.25em" fill="#64748b">HEADLINE BENCHMARK</text>
  <text x="40" y="78" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#e2e8f0">H₂O · cc-pVDZ · CCSD(T)</text>
  <text x="40" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#64748b" font-style="italic">single-run · Apple M2 Pro · WebGPU Chromium · |E_(T)_GPU − E_(T)_CPU| = 2.4×10⁻¹⁰ Ha</text>

  <text x="40" y="160" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.15em" fill="#94a3b8" font-weight="600">CPU · JavaScript f64</text>
  <rect x="40" y="172" width="780" height="46" rx="3" fill="url(#cpuBar)"/>
  <text x="60" y="203" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e2e8f0">198.6 s</text>

  <text x="40" y="260" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.15em" fill="#94a3b8" font-weight="600">GPU · WebGPU f32 → f64 reduce</text>
  <rect x="40" y="272" width="19.8" height="46" rx="3" fill="url(#gpuBar)" filter="url(#dropPerf)"/>
  <text x="80" y="303" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#22d3ee">5.05 s</text>

  <g transform="translate(900 248)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="92" font-weight="800" fill="url(#speedTxt)" text-anchor="start" letter-spacing="-0.04em">39.3×</text>
    <text x="0" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.25em">FASTER ON GPU</text>
  </g>

  <line x1="40" y1="358" x2="1160" y2="358" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="392" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.25em" fill="#64748b" font-weight="600">BUT WE'RE NOT ALWAYS FASTER · E34 vs PySCF 2.13.0 CPU</text>
  <text x="40" y="416" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic">11 of 19 cells webgpu-q faster · 8 of 19 PySCF faster · energy agreement ≤ 10⁻⁴ Ha throughout</text>

  <g font-family="ui-monospace, monospace">
    <text x="40" y="452" font-size="11" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">▸ WE WIN ON</text>
    <g transform="translate(40 472)" font-size="13">
      <g transform="translate(0 8)">
        <text x="0" y="0" fill="#e2e8f0">HF · H₂ STO-3G</text>
        <text x="490" y="0" fill="#22d3ee" font-weight="700" text-anchor="end">105× ↑</text>
      </g>
      <g transform="translate(0 36)">
        <text x="0" y="0" fill="#e2e8f0">CCSD · LiH STO-3G</text>
        <text x="490" y="0" fill="#22d3ee" font-weight="700" text-anchor="end">40× ↑</text>
      </g>
      <g transform="translate(0 64)">
        <text x="0" y="0" fill="#e2e8f0">HF · H₂O STO-3G</text>
        <text x="490" y="0" fill="#22d3ee" font-weight="700" text-anchor="end">12× ↑</text>
      </g>
      <g transform="translate(0 92)">
        <text x="0" y="0" fill="#e2e8f0">HF · H₂O cc-pVDZ</text>
        <text x="490" y="0" fill="#22d3ee" font-weight="700" text-anchor="end">1.09× ↑</text>
      </g>
      <g transform="translate(0 120)">
        <text x="0" y="0" fill="#e2e8f0">CCSD(T) · H₂O cc-pVDZ <tspan fill="#64748b" font-size="11">(GPU)</tspan></text>
        <text x="490" y="0" fill="#22d3ee" font-weight="700" text-anchor="end">PySCF can't*</text>
      </g>
    </g>

    <text x="610" y="452" font-size="11" letter-spacing="0.2em" fill="#f97316" font-weight="700">▸ WE LOSE ON</text>
    <g transform="translate(610 472)" font-size="13">
      <g transform="translate(0 8)">
        <text x="0" y="0" fill="#e2e8f0">CCSD · H₂O cc-pVDZ</text>
        <text x="510" y="0" fill="#f97316" font-weight="700" text-anchor="end">480× ↓</text>
      </g>
      <g transform="translate(0 36)">
        <text x="0" y="0" fill="#e2e8f0">MP2 · H₂O cc-pVDZ</text>
        <text x="510" y="0" fill="#f97316" font-weight="700" text-anchor="end">136× ↓</text>
      </g>
      <g transform="translate(0 64)">
        <text x="0" y="0" fill="#e2e8f0">CCSD(T)-CPU · H₂O STO-3G</text>
        <text x="510" y="0" fill="#f97316" font-weight="700" text-anchor="end">48× ↓</text>
      </g>
      <g transform="translate(0 92)">
        <text x="0" y="0" fill="#e2e8f0">CCSD(T)-CPU · BeH₂ STO-3G</text>
        <text x="510" y="0" fill="#f97316" font-weight="700" text-anchor="end">21× ↓</text>
      </g>
      <g transform="translate(0 120)">
        <text x="0" y="0" fill="#e2e8f0">MP2 · H₂ cc-pVDZ</text>
        <text x="510" y="0" fill="#f97316" font-weight="700" text-anchor="end">46× ↓</text>
      </g>
    </g>
  </g>

  <text x="40" y="608" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">* PySCF CPU can't run CCSD(T) on GPU; needs the gpu4pyscf plugin (not run here). Where PySCF wins: NumPy/BLAS-vectorized correlation methods at production basis. Where we win: no Python startup, HF, and GPU (T) at cc-pVDZ. Full comparison: experiments/results/2026-05-12/level-6/E34-comparison.md</text>
</svg>
