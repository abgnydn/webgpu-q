<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="webgpu-q v0.5.0 — quantum chemistry in a browser tab. HF, UHF, RKS/UKS-DFT, MP2, CCSD(T) on GPU 39x, EOM-CCSD, TDDFT alpha(omega), C6 dispersion, D2, Foster-Boys + Pipek-Mezey localization, Molden/Cube/QCSchema/XYZ exports. 553 tests, polarizability matrix 16 of 16 closed.">
  <defs>
    <!-- Background gradient: cool deep navy -->
    <radialGradient id="bg" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#0f1c3a"/>
      <stop offset="55%" stop-color="#070d1c"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>
    <!-- Title gradient: cyan → amber for the "webgpu" / "q" split -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#ffb56e"/>
    </linearGradient>
    <!-- Q-orbital glow -->
    <radialGradient id="orbital1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#6ea8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbital2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb56e" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft glow filter for the title -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6ea8ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative orbital lobes (subtle, lower-right) -->
  <g opacity="0.55">
    <circle cx="1010" cy="195" r="180" fill="url(#orbital1)"/>
    <circle cx="930" cy="395" r="150" fill="url(#orbital2)"/>
    <!-- Bond lines connecting the lobes (molecular feel) -->
    <g stroke="#6ea8ff" stroke-width="1.4" fill="none" opacity="0.35">
      <line x1="1010" y1="195" x2="930" y2="395"/>
      <line x1="930" y1="395" x2="1085" y2="475"/>
    </g>
    <!-- "Atom" dots -->
    <circle cx="1010" cy="195" r="6" fill="#22d3ee"/>
    <circle cx="930"  cy="395" r="6" fill="#ffb56e"/>
    <circle cx="1085" cy="475" r="4" fill="#f472b6"/>
  </g>

  <!-- Top-left version badge -->
  <g transform="translate(72 64)">
    <rect x="0" y="0" width="118" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/>
    <circle cx="20" cy="16" r="5" fill="#22d3ee"/>
    <text x="36" y="21" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.08em">v0.5.0</text>
  </g>
  <text x="208" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.2em">QUANTUM CHEMISTRY · BROWSER-NATIVE</text>

  <!-- Hero title -->
  <text x="72" y="225" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="128" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.04em" filter="url(#glow)">webgpu-q</text>

  <!-- Subtitle -->
  <text x="72" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#e2e8f0" letter-spacing="0.01em">PySCF in a Chrome tab — <tspan fill="#22d3ee" font-weight="700">no install · no CUDA</tspan></text>

  <!-- Capability row -->
  <g transform="translate(72 322)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#94a3b8" letter-spacing="-0.005em">
      <tspan x="0" dy="0">HF · UHF · RKS-DFT · UKS-DFT · MP2 · CCSD · <tspan fill="#34d399" font-weight="700">CCSD(T) 39× on GPU</tspan></tspan>
      <tspan x="0" dy="28">EE/IP/EA-EOM-CCSD · CIS · TDA · TDDFT α(ω) · Casimir-Polder C₆</tspan>
      <tspan x="0" dy="28">Grimme D2 dispersion · Foster-Boys + Pipek-Mezey localization</tspan>
      <tspan x="0" dy="28">NOON · multireference verdict · TRK · energy decomposition</tspan>
      <tspan x="0" dy="28" fill="#cbd5e1">Molden · Gaussian Cube · QCSchema · XYZ exports</tspan>
    </text>
  </g>

  <!-- Bottom stat cards -->
  <g transform="translate(72 530)">
    <!-- Card 1: tests -->
    <g transform="translate(0 0)">
      <rect width="246" height="74" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#22d3ee"/>
      <text x="22" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="32" font-weight="800" fill="#e2e8f0" letter-spacing="-0.02em">553</text>
      <text x="98" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="0.18em">TESTS</text>
      <text x="98" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">all green</text>
      <text x="22" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">vitest + 11 Playwright · CI green</text>
    </g>

    <!-- Card 2: polarizability matrix -->
    <g transform="translate(266 0)">
      <rect width="270" height="74" rx="10" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.45" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#c084fc"/>
      <text x="22" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="32" font-weight="800" fill="#e2e8f0" letter-spacing="-0.02em">16<tspan font-size="22" fill="#94a3b8">/16</tspan></text>
      <text x="112" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.18em">POLARIZABILITY</text>
      <text x="112" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">matrix · v0.5.0 closed</text>
      <text x="22" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">{RHF,UHF,RKS,UKS} × {α,α(ω),α(iω),C₆}</text>
    </g>

    <!-- Card 3: GPU speedup -->
    <g transform="translate(556 0)">
      <rect width="246" height="74" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#fbbf24"/>
      <text x="22" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="32" font-weight="800" fill="#e2e8f0" letter-spacing="-0.02em">39<tspan font-size="22">×</tspan></text>
      <text x="98" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.18em">CCSD(T) GPU</text>
      <text x="98" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">H₂O cc-pVDZ · 5.05 s</text>
      <text x="22" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">WebGPU · f32→f64 reduce</text>
    </g>
  </g>

  <!-- URL bottom-right -->
  <text x="1128" y="608" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="0.04em">webgpu-q.vercel.app</text>
</svg>
