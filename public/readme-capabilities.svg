<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Capability map: ground state (HF/UHF/RKS/UKS-DFT), correlation (MP2/CCSD/CCSD(T)), excited states (EOM-CCSD/TDDFT), properties (polarizability α(ω), C₆ dispersion, D2, Foster-Boys, NOON), geometry, density fitting, many-body sim">
  <defs>
    <linearGradient id="bgCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="dotsCap" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="cardShCap" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bgCap)"/>
  <rect width="1200" height="500" fill="url(#dotsCap)"/>

  <g font-family="ui-monospace, monospace">

    <g transform="translate(20 30)">
      <rect width="285" height="200" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="285" height="6" rx="3" fill="#22d3ee"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">GROUND STATE</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">HF · UHF · RKS · UKS · MP2</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ RHF · UHF · DIIS · level-shift</text>
        <text x="20" y="142">↳ RKS-DFT + UKS-DFT (full ladder)</text>
        <text x="20" y="166">↳ LDA · BVWN5 · BLYP · B3VWN5 · B3LYP5</text>
        <text x="20" y="190">↳ MP2 · UMP2 · DF-MP2 · runMP2Auto</text>
      </g>
    </g>

    <g transform="translate(315 30)">
      <rect width="285" height="200" rx="10" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="285" height="6" rx="3" fill="#34d399"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#34d399" font-weight="700">CORRELATION</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">CCSD · CCSD(T) · UCCSD(T)</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ CCSD + UCCSD · frozen-core via Set</text>
        <text x="20" y="142">↳ CCSD(T) + UCCSD(T) · non-contig FC</text>
        <text x="20" y="166">↳ (T) on CPU + <tspan fill="#34d399" font-weight="700">GPU ~14× median</tspan> on H₂O cc-pVDZ</text>
        <text x="20" y="190">↳ FCI · CASCI · CCSD ≥ 95% capture</text>
      </g>
    </g>

    <g transform="translate(610 30)">
      <rect width="285" height="200" rx="10" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="285" height="6" rx="3" fill="#c084fc"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#c084fc" font-weight="700">EXCITED STATES</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">EOM-CCSD · TDDFT · TDHF α(ω)</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ EE-EOM-CCSD <tspan fill="#c084fc" font-weight="700">10⁻⁵ Ha vs FCI</tspan></text>
        <text x="20" y="142">↳ IP / EA-EOM-CCSD · Davidson</text>
        <text x="20" y="166">↳ CIS · TDA · TDDFT · UHF-TDHF · UKS-TDDFT</text>
        <text x="20" y="190">↳ uvVisSpectrum pipeline · TRK check</text>
      </g>
    </g>

    <g transform="translate(905 30)">
      <rect width="275" height="200" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="275" height="6" rx="3" fill="#fbbf24"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#fbbf24" font-weight="700">PROPERTIES</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">α(ω) · C₆ · D2 · NOON</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ static + dynamic α + C₆ Casimir-Polder</text>
        <text x="20" y="142">↳ Grimme D2 (energy + ∇)</text>
        <text x="20" y="166">↳ Mulliken · Mayer · NOON · multi-ref verdict</text>
        <text x="20" y="190">↳ Molden · Cube · QCSchema · XYZ exports</text>
      </g>
    </g>

    <g transform="translate(20 250)">
      <rect width="375" height="220" rx="10" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="375" height="6" rx="3" fill="#f472b6"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#f472b6" font-weight="700">GEOMETRY</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">Analytical ∇ · BFGS</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ HF analytical gradients (Pulay 1969)</text>
        <text x="20" y="142">↳ DFT analytical gradients</text>
        <text x="20" y="166">↳ L-BFGS optimization</text>
        <text x="20" y="190">↳ Hessian by finite diff → normal modes</text>
        <text x="20" y="210" fill="#64748b" font-style="italic">H₂O entropy 45.06 vs expt 45.1 cal/mol·K</text>
      </g>
    </g>

    <g transform="translate(405 250)">
      <rect width="375" height="220" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="375" height="6" rx="3" fill="#06b6d4"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#06b6d4" font-weight="700">DENSITY FITTING</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">Aux-basis f64 DF</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ Streaming 3-index (μν|P), no 4-index ERI</text>
        <text x="20" y="142">↳ Rank-3 B-tensor, naphthalene HF in a tab</text>
        <text x="20" y="166">↳ runRHFAuto family · size-gated exact/DF</text>
        <text x="20" y="190">↳ <tspan fill="#06b6d4" font-weight="700">7×10⁻¹⁴ Ha</tspan> vs direct HF (machine precision)</text>
        <text x="20" y="210" fill="#64748b" font-style="italic">GPU DF experimental — WebGPU has no f64</text>
      </g>
    </g>

    <g transform="translate(790 250)">
      <rect width="390" height="220" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.4" filter="url(#cardShCap)"/>
      <rect x="0" y="0" width="390" height="6" rx="3" fill="#a78bfa"/>
      <text x="20" y="42" font-size="11" letter-spacing="0.2em" fill="#a78bfa" font-weight="700">MANY-BODY SIM</text>
      <text x="20" y="78" font-size="20" font-weight="700" fill="#e2e8f0">statevector · MPS · DMRG</text>
      <g font-size="13" fill="#94a3b8">
        <text x="20" y="118">↳ GPU statevector · <tspan fill="#a78bfa" font-weight="700">F ≥ 0.999999</tspan></text>
        <text x="20" y="142">↳ MPS · canonical TEBD · Jacobi SVD</text>
        <text x="20" y="166">↳ DMRG + Lanczos + MPO</text>
        <text x="20" y="190">↳ Kernel fusion · <tspan fill="#a78bfa" font-weight="700">4.22×</tspan> headline</text>
        <text x="20" y="210" fill="#64748b" font-style="italic">TFIM / Heisenberg N=128 in browser</text>
      </g>
    </g>
  </g>
</svg>
