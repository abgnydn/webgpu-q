<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="webgpu-q — quantum chemistry and many-body physics in a browser tab">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>

  <g opacity="0.85">
    <circle cx="120" cy="60" r="1.2" fill="#22d3ee" opacity="0.7"/>
    <circle cx="220" cy="110" r="0.9" fill="#a78bfa" opacity="0.6"/>
    <circle cx="80" cy="200" r="1.6" fill="#ffffff" opacity="0.5"/>
    <circle cx="190" cy="320" r="1.1" fill="#34d399" opacity="0.6"/>
    <circle cx="60" cy="380" r="0.9" fill="#fbbf24" opacity="0.65"/>
    <circle cx="290" cy="420" r="1.3" fill="#22d3ee" opacity="0.55"/>
    <circle cx="980" cy="70" r="1.4" fill="#c084fc" opacity="0.6"/>
    <circle cx="1100" cy="150" r="0.9" fill="#22d3ee" opacity="0.55"/>
    <circle cx="1020" cy="240" r="1.6" fill="#ffffff" opacity="0.45"/>
    <circle cx="1140" cy="330" r="1.1" fill="#34d399" opacity="0.6"/>
    <circle cx="970" cy="400" r="1.0" fill="#fbbf24" opacity="0.55"/>
    <circle cx="1080" cy="430" r="1.3" fill="#a78bfa" opacity="0.55"/>
    <circle cx="430" cy="70" r="0.9" fill="#ffffff" opacity="0.5"/>
    <circle cx="780" cy="90" r="1.2" fill="#22d3ee" opacity="0.55"/>
    <circle cx="350" cy="410" r="1.1" fill="#c084fc" opacity="0.55"/>
    <circle cx="870" cy="430" r="1.0" fill="#34d399" opacity="0.55"/>
  </g>

  <g transform="translate(600 232)" stroke-width="1" fill="none">
    <ellipse rx="440" ry="120" stroke="#22d3ee" opacity="0.22"/>
    <ellipse rx="440" ry="120" stroke="#a78bfa" opacity="0.22" transform="rotate(60)"/>
    <ellipse rx="440" ry="120" stroke="#34d399" opacity="0.22" transform="rotate(120)"/>
  </g>

  <circle cx="600" cy="232" r="220" fill="url(#orb)"/>

  <text x="600" y="224" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="120" font-weight="800" fill="url(#title)" text-anchor="middle" letter-spacing="-0.04em" filter="url(#glow)">webgpu-q</text>

  <text x="600" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.04em">quantum chemistry · many-body physics · <tspan fill="#22d3ee" font-weight="700">in a browser tab</tspan></text>

  <text x="600" y="312" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" font-style="italic">every advanced physics simulation in the world should ship as a URL</text>

  <line x1="380" y1="350" x2="820" y2="350" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(0 400)">
    <g>
      <text x="175" y="0" font-family="ui-monospace, monospace" font-size="40" font-weight="800" fill="#22d3ee" text-anchor="middle">401</text>
      <text x="175" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.15em">TESTS GREEN</text>
    </g>
    <g>
      <text x="430" y="0" font-family="ui-monospace, monospace" font-size="40" font-weight="800" fill="#34d399" text-anchor="middle">39×</text>
      <text x="430" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.15em">CCSD(T) ON GPU</text>
    </g>
    <g>
      <text x="760" y="0" font-family="ui-monospace, monospace" font-size="40" font-weight="800" fill="#c084fc" text-anchor="middle">10⁻⁵ Ha</text>
      <text x="760" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.15em">EOM-CCSD ↔ FCI</text>
    </g>
    <g>
      <text x="1025" y="0" font-family="ui-monospace, monospace" font-size="40" font-weight="800" fill="#fbbf24" text-anchor="middle">cc-pVDZ</text>
      <text x="1025" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.15em">H₂O · 5 s · BROWSER</text>
    </g>
  </g>
</svg>
