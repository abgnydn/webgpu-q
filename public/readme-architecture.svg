<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Architecture stack: URL, dashboard, experiments, chemistry/many-body, linalg core, WGSL shaders, WebGPU, GPU silicon">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="dotsArch" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <linearGradient id="L1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="L2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="L3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="L4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="L5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="L6" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="L7" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="L8" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
    <filter id="layerShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bgArch)"/>
  <rect width="1200" height="620" fill="url(#dotsArch)"/>

  <text x="40" y="38" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.25em" fill="#64748b" font-weight="600">SYSTEM ARCHITECTURE</text>
  <text x="40" y="68" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#e2e8f0">URL → silicon · 8 layers</text>

  <g font-family="ui-monospace, monospace">

    <g transform="translate(40 100)">
      <rect width="900" height="58" rx="6" fill="url(#L1)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#fae8ff" font-weight="700">LAYER 1 · USER ENTRY</text>
      <text x="24" y="48" font-size="18" font-weight="700" fill="#ffffff">https://webgpu-q.vercel.app</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ bookmark, share, embed</text>
      <text x="950" y="50" font-size="12" fill="#64748b">no install · no backend · no CUDA</text>
    </g>

    <g transform="translate(40 168)">
      <rect width="900" height="58" rx="6" fill="url(#L2)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#ede9fe" font-weight="700">LAYER 2 · FRONTEND</text>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#ffffff">/index · /molecule.html · /experiments/ · /viz.html</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ Vite + TS · zero framework</text>
      <text x="950" y="50" font-size="12" fill="#64748b">landing · SI report · research dash · 4D viz</text>
    </g>

    <g transform="translate(40 236)">
      <rect width="900" height="58" rx="6" fill="url(#L3)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#e0e7ff" font-weight="700">LAYER 3 · RESEARCH HARNESS</text>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#ffffff">experiments/lib/ · runner · seeds · env · fidelity · stats</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ E1 – E33 · JSON artifacts</text>
      <text x="950" y="50" font-size="12" fill="#64748b">5 warmup · 20 trials · |⟨ψ|ψ'⟩|² pass bar</text>
    </g>

    <g transform="translate(40 304)">
      <rect width="900" height="58" rx="6" fill="url(#L4)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#cffafe" font-weight="700">LAYER 4 · CHEMISTRY + MANY-BODY</text>
      <text x="24" y="48" font-size="14" font-weight="700" fill="#ffffff">hf-scf · uhf-scf · ccsd · ccsd-t · eom-ccsd · uccsd · dft · cis · tddft · df · gradients · mps · dmrg</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ src/chemistry · src/manybody</text>
      <text x="950" y="50" font-size="12" fill="#64748b">TS strict · noUncheckedIndexedAccess</text>
    </g>

    <g transform="translate(40 372)">
      <rect width="900" height="58" rx="6" fill="url(#L5)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#d1fae5" font-weight="700">LAYER 5 · NUMERICAL CORE</text>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#ffffff">linalg · Jacobi complex SVD · Hessenberg + Wilkinson QR · back-sub eigenvectors</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ src/linalg · src/manybody</text>
      <text x="950" y="50" font-size="12" fill="#64748b">non-symmetric eigsolver powers EOM-CCSD</text>
    </g>

    <g transform="translate(40 440)">
      <rect width="900" height="58" rx="6" fill="url(#L6)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#fef3c7" font-weight="700">LAYER 6 · WGSL SHADERS</text>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#1f1300">single-qubit.wgsl · two-qubit.wgsl · ccsd-t.wgsl</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ 1 thread per (i,j,k) triple</text>
      <text x="950" y="50" font-size="12" fill="#64748b">f32 storage · f64 CPU reduce</text>
    </g>

    <g transform="translate(40 508)">
      <rect width="900" height="58" rx="6" fill="url(#L7)" filter="url(#layerShadow)"/>
      <text x="24" y="24" font-size="10" letter-spacing="0.2em" fill="#ffedd5" font-weight="700">LAYER 7 · WEBGPU API</text>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#ffffff">requestAdapter · createBuffer · compute pipeline · bind groups · queue.submit + sync</text>
      <text x="950" y="32" font-size="13" fill="#94a3b8" font-style="italic">→ requiredLimits explicitly raised</text>
      <text x="950" y="50" font-size="12" fill="#64748b">maxBufferSize · maxStorageBufferBindingSize</text>
    </g>

    <g transform="translate(40 576)">
      <rect width="900" height="36" rx="6" fill="url(#L8)" filter="url(#layerShadow)"/>
      <text x="24" y="16" font-size="9" letter-spacing="0.2em" fill="#fee2e2" font-weight="700">LAYER 8 · SILICON</text>
      <text x="24" y="30" font-size="13" font-weight="700" fill="#ffffff">Apple M-series · NVIDIA · AMD · Intel · whatever the browser brings</text>
      <text x="950" y="24" font-size="11" fill="#64748b" font-style="italic">→ tested on M2 Pro</text>
    </g>
  </g>
</svg>
