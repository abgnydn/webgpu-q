<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Research ladder: 6 levels — statevector, MPS, kernel fusion, WebRTC swarm, hardware verify, quantum chemistry">
  <defs>
    <linearGradient id="bgLad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="dotsLad" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="ladShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="65%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bgLad)"/>
  <rect width="1200" height="400" fill="url(#dotsLad)"/>

  <text x="40" y="38" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.25em" fill="#64748b" font-weight="600">RESEARCH LADDER</text>
  <text x="40" y="68" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#e2e8f0">6 levels · shipped or honestly deferred</text>

  <rect x="100" y="218" width="1000" height="4" rx="2" fill="url(#trackGrad)"/>

  <g font-family="ui-monospace, monospace">

    <g transform="translate(60 130)">
      <rect width="170" height="170" rx="10" fill="#0f3a5c" stroke="#22d3ee" stroke-opacity="0.6" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">LEVEL 1</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#e2e8f0">Statevector</text>
      <text x="14" y="86" font-size="11" fill="#94a3b8">E1 – E4</text>
      <text x="14" y="106" font-size="11" fill="#94a3b8">GPU gates</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#22d3ee">F ≥ 0.999999</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">shipped ✓</text>
      <circle cx="85" cy="90" r="11" fill="#22d3ee" stroke="#0b1224" stroke-width="3"/>
    </g>

    <g transform="translate(240 130)">
      <rect width="170" height="170" rx="10" fill="#0f3a5c" stroke="#22d3ee" stroke-opacity="0.6" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">LEVEL 2</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#e2e8f0">MPS · DMRG</text>
      <text x="14" y="86" font-size="11" fill="#94a3b8">E5 – E7, E18, E19</text>
      <text x="14" y="106" font-size="11" fill="#94a3b8">TFIM · Heisenberg</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#22d3ee">N = 128 in browser</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">shipped ✓ · ITensor cross-checked</text>
    </g>

    <g transform="translate(420 130)">
      <rect width="170" height="170" rx="10" fill="#0f3a5c" stroke="#22d3ee" stroke-opacity="0.6" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#22d3ee" font-weight="700">LEVEL 3</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#e2e8f0">Kernel fusion</text>
      <text x="14" y="86" font-size="11" fill="#94a3b8">E8 – E13</text>
      <text x="14" y="106" font-size="11" fill="#94a3b8">Tier B/C/D</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#22d3ee">4.18× headline</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">shipped ✓ · Tier D plateau honest</text>
    </g>

    <g transform="translate(600 130)">
      <rect width="170" height="170" rx="10" fill="#1e293b" stroke="#475569" stroke-opacity="0.6" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#94a3b8" font-weight="700">LEVEL 4</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#cbd5e1">WebRTC swarm</text>
      <text x="14" y="86" font-size="11" fill="#64748b">distributed 1D chain</text>
      <text x="14" y="106" font-size="11" fill="#64748b">across browser tabs</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#94a3b8">~3–5 sessions</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">deferred · well-scoped</text>
    </g>

    <g transform="translate(780 130)">
      <rect width="170" height="170" rx="10" fill="#1e293b" stroke="#475569" stroke-opacity="0.6" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#94a3b8" font-weight="700">LEVEL 5</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#cbd5e1">Hardware verify</text>
      <text x="14" y="86" font-size="11" fill="#64748b">IBM Heron r2</text>
      <text x="14" y="106" font-size="11" fill="#64748b">Nighthawk 120q</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#94a3b8">~4–6 sessions</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">deferred</text>
    </g>

    <g transform="translate(960 130)">
      <rect width="170" height="170" rx="10" fill="#1e3a2f" stroke="#34d399" stroke-opacity="0.8" filter="url(#ladShadow)"/>
      <text x="14" y="32" font-size="10" letter-spacing="0.2em" fill="#34d399" font-weight="700">LEVEL 6 · FLAGSHIP</text>
      <text x="14" y="56" font-size="16" font-weight="700" fill="#e2e8f0">Quantum chemistry</text>
      <text x="14" y="86" font-size="11" fill="#94a3b8">E16, E20 – E33</text>
      <text x="14" y="106" font-size="11" fill="#94a3b8">HF → CCSD(T) → EOM</text>
      <text x="14" y="128" font-size="12" font-weight="700" fill="#34d399">Tier 2 stages 1 – 38 ✓</text>
      <text x="14" y="152" font-size="10" fill="#64748b" font-style="italic">shipped ✓ · 401 tests</text>
    </g>
  </g>

  <g transform="translate(40 358)" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">
    <rect x="0" y="-8" width="11" height="11" rx="2" fill="#0f3a5c" stroke="#22d3ee"/>
    <text x="18" y="0">shipped + validated (foundation)</text>
    <rect x="220" y="-8" width="11" height="11" rx="2" fill="#1e3a2f" stroke="#34d399"/>
    <text x="238" y="0">shipped + validated (flagship)</text>
    <rect x="440" y="-8" width="11" height="11" rx="2" fill="#1e293b" stroke="#475569"/>
    <text x="458" y="0">deferred · well-scoped</text>
  </g>
</svg>
